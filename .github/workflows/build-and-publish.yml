name: Build and Publish NuGet

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: write
  packages: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.version.outputs.should_publish }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para leer todos los tags y commits

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Calculate semantic version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          # Obtiene el último tag semántico, si no existe parte desde 0.0.0
          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            | sort -V | tail -n1)

          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v0.0.0"
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s" "${LAST_TAG}..HEAD")
          fi

          if [ -z "$COMMITS" ]; then
            echo "No new commits since last tag. Skipping publish."
            echo "should_publish=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          MAJOR=$(echo "$LAST_TAG" | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo "$LAST_TAG" | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo "$LAST_TAG" | sed 's/v//' | cut -d. -f3)

          # Detecta el tipo de cambio según Conventional Commits
          # BREAKING CHANGE o "!" -> MAJOR
          # feat:                 -> MINOR
          # fix: / chore: / etc  -> PATCH
          if echo "$COMMITS" | grep -qiE "^(feat|fix|refactor|perf|chore)(\(.+\))?!:|BREAKING CHANGE:"; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "should_publish=true"    >> $GITHUB_OUTPUT
          echo "Calculated version: ${NEW_VERSION}"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          steps.version.outputs.should_publish == 'true'
        run: |
          dotnet pack \
            --configuration Release \
            --no-build \
            -o out \
            /p:PackageVersion=${{ steps.version.outputs.version }} \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg

      - name: Upload package artifact
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          steps.version.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: out/
          retention-days: 7

  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.build-and-test.outputs.should_publish == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: out/

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "./out/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate

      - name: Create Git tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.build-and-test.outputs.version }}
          TAG="v${VERSION}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          # Genera el changelog automático desde los commits
          NOTES=$(git log \
            $(git tag --list 'v[0-9]*' | sort -V | tail -n2 | head -n1)..HEAD \
            --pretty=format:"- %s (%h)" \
            | grep -v "^$")

          gh release create "$TAG" ./out/*.nupkg ./out/*.snupkg \
            --title "Release $TAG" \
            --notes "${NOTES:-No changelog available}"